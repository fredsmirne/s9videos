<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Wet Room w/ Rooftop Hot Tub — S9 Videos</title>
<meta property="og:title" content="Luxury Wet Room w/ Rooftop Hot Tub to Broadway — Video Tour">
<meta property="og:description" content="Watch the video tour of this Nashville listing. Produced by S9 Videos.">
<meta property="og:type" content="video.other">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --text: #f4f2ee;
    --muted: #9a968f;
    --accent: #d8b56a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 20px;
    text-align: center;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  .wordmark span { color: var(--accent); }
  main {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 24px 48px;
  }
  .player {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .details {
    padding: 28px 6px 0;
    text-align: center;
  }
  h1 {
    font-size: clamp(20px, 3.4vw, 28px);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .location {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge {
    display: inline-block;
    margin-top: 18px;
    padding: 7px 16px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  footer {
    padding: 26px 24px 34px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.06em;
  }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
</style>
</head>
<body>
  <header>
    <div class="wordmark">S<span>9</span> Videos</div>
  </header>
  <main>
    <div class="player">
      <video controls playsinline poster="" controlslist="nodownload">
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
    </div>
    <div class="details">
      <h1>Luxury Wet Room w/ Rooftop Hot Tub to Broadway</h1>
      <div class="location">Nashville, Tennessee</div>
      <div class="badge">Preview</div>
    </div>
  </main>
  <footer>
    Video tour produced by <a href="https://s9videos.com">S9 Videos</a>
  </footer>
</body>
</html>
