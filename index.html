<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S9 Videos — Cinematic Video Tours for Short-Term Rentals</title>
<meta name="description" content="Cinematic video tours that make your Airbnb listing stand out. Produced and delivered ready to post.">
<style>
  :root { --bg:#0d0d0f; --text:#f4f2ee; --muted:#9a968f; --accent:#d8b56a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:32px;
  }
  .wordmark { font-size: clamp(28px, 6vw, 48px); font-weight:700; letter-spacing:0.3em; text-transform:uppercase; }
  .wordmark span { color: var(--accent); }
  .tagline { margin-top:18px; color:var(--muted); font-size: clamp(14px, 2.4vw, 18px); letter-spacing:0.06em; max-width: 480px; line-height:1.6; }
  .rule { width:56px; height:1px; background:var(--accent); margin:34px auto 0; }
  footer { position:fixed; bottom:26px; color:var(--muted); font-size:12px; letter-spacing:0.08em; }
</style>
</head>
<body>
  <div>
    <div class="wordmark">S<span>9</span> Videos</div>
    <p class="tagline">Cinematic video tours that make your short-term rental stand out — produced, branded, and delivered ready to post.</p>
    <div class="rule"></div>
  </div>
  <footer>© S9 Videos</footer>
</body>
</html>
